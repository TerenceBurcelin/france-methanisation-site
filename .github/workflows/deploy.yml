name: Déploiement IONOS

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Déploiement SFTP vers IONOS
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.IONOS_SFTP_USER }}
          server: ${{ secrets.IONOS_SFTP_HOST }}
          password: ${{ secrets.IONOS_SFTP_PASS }}
          port: ${{ secrets.IONOS_SFTP_PORT }}
          sftp_only: true
          local_path: './*'
          remote_path: ${{ secrets.IONOS_REMOTE_DIR }}
